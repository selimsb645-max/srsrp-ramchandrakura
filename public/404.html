<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <title>লোড হচ্ছে…</title>
    <script>
      // GitHub Pages SPA fallback: send the requested path to index.html, which
      // React Router then resolves. Keeps deep links such as /committee working.
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        var base = '/' + (segments.length ? segments[0] + '/' : '');
        var redirect = base + '?/' + segments.slice(1).join('/') + location.search + location.hash;
        location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
